<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정확한 초 맞추기 게임</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts for Digital Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Digital LED Clock Styling */
        .digital-font {
            font-family: 'Orbitron', monospace;
        }

        /* Glowing Yellow Digital Text */
        .yellow-glow {
            color: #facc15;
            text-shadow: 
                0 0 10px rgba(250, 204, 21, 0.6),
                0 0 20px rgba(250, 204, 21, 0.4),
                0 0 30px rgba(250, 204, 21, 0.2);
        }

        /* Target Time Pulse Effect */
        .target-glow {
            color: #38bdf8;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
        }

        /* Button Active Scale Animations */
        .btn-interact {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-interact:active {
            transform: scale(0.95);
        }

        /* Background Grid Pattern */
        .bg-grid {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-grid min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-md rounded-3xl border border-slate-800 p-6 md:p-8 shadow-2xl flex flex-col items-center text-center relative overflow-hidden">
        
        <!-- Game Title -->
        <h1 class="text-xl md:text-2xl font-extrabold text-slate-300 tracking-wider mb-6 flex items-center gap-2">
            ⏱️ 초 맞추기 챌린지
        </h1>

        <!-- Target Time Section (목표 초) -->
        <div class="w-full bg-slate-800/60 rounded-2xl p-4 border border-slate-700/50 mb-6 flex flex-col items-center">
            <span class="text-xs md:text-sm font-semibold text-slate-400 uppercase tracking-widest mb-1">목표 시간 (Target)</span>
            <div id="target-display" class="digital-font text-3xl md:text-4xl font-extrabold target-glow tracking-wide">
                00.00초
            </div>
        </div>

        <!-- Stopwatch Display Section (소수 둘째자리 초시계) -->
        <div class="w-full bg-black/70 rounded-3xl p-8 border-2 border-slate-800 shadow-inner my-2 flex flex-col items-center justify-center relative">
            <span class="text-xs text-slate-500 absolute top-3 left-4 font-mono">STOPWATCH</span>
            <div id="stopwatch-display" class="digital-font text-5xl sm:text-6xl font-black yellow-glow tracking-wider py-2">
                00.00
            </div>
            <span class="text-xs text-slate-500 absolute bottom-3 right-4 font-mono">SECONDS</span>
        </div>

        <!-- Result / Feedback Banner -->
        <div id="result-banner" class="w-full min-h-[72px] my-4 flex flex-col items-center justify-center rounded-xl p-2 transition-all opacity-0 scale-95">
            <div id="result-diff" class="text-lg font-extrabold"></div>
            <div id="result-grade" class="text-xs font-semibold text-slate-400 mt-1"></div>
        </div>

        <!-- Controls Section (버튼) -->
        <div class="w-full grid grid-cols-2 gap-4 mt-2">
            <!-- Start / Stop Button -->
            <button id="toggle-btn" class="btn-interact w-full py-4 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-lg shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
                <svg id="play-icon" class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="stop-icon" class="w-6 h-6 fill-current hidden" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                <span id="toggle-text">시작</span>
            </button>

            <!-- Reset Button -->
            <button id="reset-btn" class="btn-interact w-full py-4 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-lg shadow-md flex items-center justify-center gap-2">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                <span>리셋</span>
            </button>
        </div>

        <!-- Best Record / Stats Footer -->
        <div class="mt-6 pt-4 border-t border-slate-800/80 w-full flex justify-between items-center text-xs text-slate-400 font-mono">
            <span>최고 기록: <strong id="best-score" class="text-slate-200">--.--초 차이</strong></span>
            <span>시도 횟수: <strong id="attempts-count" class="text-slate-200">0회</strong></span>
        </div>
    </div>

    <script>
        // Game State Variables
        let targetTime = 0.00;
        let startTime = 0;
        let elapsedTime = 0;
        let timerAnimationId = null;
        let isRunning = false;
        let bestDiff = null;
        let attempts = 0;

        // DOM Elements
        const targetDisplay = document.getElementById('target-display');
        const stopwatchDisplay = document.getElementById('stopwatch-display');
        const toggleBtn = document.getElementById('toggle-btn');
        const toggleText = document.getElementById('toggle-text');
        const playIcon = document.getElementById('play-icon');
        const stopIcon = document.getElementById('stop-icon');
        const resetBtn = document.getElementById('reset-btn');
        const resultBanner = document.getElementById('result-banner');
        const resultDiff = document.getElementById('result-diff');
        const resultGrade = document.getElementById('result-grade');
        const bestScoreDisplay = document.getElementById('best-score');
        const attemptsCountDisplay = document.getElementById('attempts-count');

        // Helper: Format number to 2 decimal places with leading zero (00.00)
        function formatTime(seconds) {
            const secNum = Math.floor(seconds);
            const decimals = Math.floor((seconds % 1) * 100);
            const formattedSec = String(secNum).padStart(2, '0');
            const formattedDec = String(decimals).padStart(2, '0');
            return `${formattedSec}.${formattedDec}`;
        }

        // Generate Random Target Time between 10.00 and 30.00
        function generateTargetTime() {
            // Pick a random float between 10 and 30 with 2 decimals
            const randomVal = (Math.random() * (30 - 10) + 10).toFixed(2);
            targetTime = parseFloat(randomVal);
            targetDisplay.textContent = `${formatTime(targetTime)}초`;
        }

        // High precision timer loop using performance.now() and requestAnimationFrame
        function updateTimer() {
            if (!isRunning) return;
            const now = performance.now();
            elapsedTime = (now - startTime) / 1000;
            stopwatchDisplay.textContent = formatTime(elapsedTime);
            timerAnimationId = requestAnimationFrame(updateTimer);
        }

        // Start Timer
        function startTimer() {
            isRunning = true;
            startTime = performance.now() - (elapsedTime * 1000);
            
            // UI Button Updates (Change to Stop style)
            toggleBtn.classList.remove('bg-emerald-500', 'hover:bg-emerald-400', 'shadow-emerald-500/20');
            toggleBtn.classList.add('bg-rose-500', 'hover:bg-rose-400', 'shadow-rose-500/20');
            toggleText.textContent = '멈추기';
            playIcon.classList.add('hidden');
            stopIcon.classList.remove('hidden');

            // Hide previous results
            resultBanner.classList.add('opacity-0', 'scale-95');
            
            // Start animation loop
            timerAnimationId = requestAnimationFrame(updateTimer);
        }

        function stopTimer() {
            isRunning = false;
            cancelAnimationFrame(timerAnimationId);

            // UI Button Updates (Change back to Start style)
            toggleBtn.classList.remove('bg-rose-500', 'hover:bg-rose-400', 'shadow-rose-500/20');
            toggleBtn.classList.add('bg-emerald-500', 'hover:bg-emerald-400', 'shadow-emerald-500/20');
            toggleText.textContent = '시작';
            stopIcon.classList.add('hidden');
            playIcon.classList.remove('hidden');

            // Calculate Difference
            const diff = elapsedTime - targetTime;
            const absDiff = Math.abs(diff);

            // Update stats
            attempts++;
            attemptsCountDisplay.textContent = `${attempts}회`;

            if (bestDiff === null || absDiff < bestDiff) {
                bestDiff = absDiff;
                bestScoreDisplay.textContent = `${absDiff === 0 ? '0.00' : (diff > 0 ? '+' : '-') + absDiff.toFixed(2)}초 차이`;
            }

            // Show Evaluation Result
            evaluateResult(diff, absDiff);
        }

        // Evaluate precision and display feedback banner
        function evaluateResult(diff, absDiff) {
            let title = '';
            let gradeText = '';
            let bgColor = '';
            let textColor = '';

            const sign = diff >= 0 ? '+' : '-';
            const diffStr = `${sign}${absDiff.toFixed(2)}초`;

            if (absDiff === 0.00) {
                title = `🎉 PERFECT! (${diffStr})`;
                gradeText = '신의 손! 정확하게 맞추셨습니다!';
                bgColor = 'bg-yellow-500/20';
                textColor = 'text-yellow-400';
                triggerConfetti(true);
            } else if (absDiff <= 0.05) {
                title = `🔥 대박! (${diffStr})`;
                gradeText = '전설적인 감각입니다!';
                bgColor = 'bg-emerald-500/20';
                textColor = 'text-emerald-400';
                triggerConfetti(false);
            } else if (absDiff <= 0.20) {
                title = `👏 엄청나요! (${diffStr})`;
                gradeText = '아주 우수한 결과입니다!';
                bgColor = 'bg-sky-500/20';
                textColor = 'text-sky-400';
            } else if (absDiff <= 0.50) {
                title = `👍 아깝네요! (${diffStr})`;
                gradeText = '조금만 더 집중해보세요!';
                bgColor = 'bg-slate-800';
                textColor = 'text-slate-300';
            } else {
                title = `😅 아쉬워요 (${diffStr})`;
                gradeText = '다음 기회에 도전하세요!';
                bgColor = 'bg-rose-500/10';
                textColor = 'text-rose-400';
            }

            resultDiff.textContent = title;
            resultGrade.textContent = gradeText;
            resultBanner.className = `w-full min-h-[72px] my-4 flex flex-col items-center justify-center rounded-2xl p-3 transition-all duration-300 border ${bgColor} ${textColor} border-current/30 opacity-100 scale-100`;
        }

        // Confetti Particle Effect
        function triggerConfetti(isPerfect) {
            if (typeof confetti !== 'function') return;

            if (isPerfect) {
                // Mega confetti burst
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            } else {
                // Standard celebration
                confetti({
                    particleCount: 40,
                    spread: 50,
                    origin: { y: 0.6 }
                });
            }
        }

        // Reset Game
        function resetGame() {
            if (isRunning) {
                isRunning = false;
                cancelAnimationFrame(timerAnimationId);
            }

            // Reset time and displays
            elapsedTime = 0;
            stopwatchDisplay.textContent = "00.00";

            // Reset Toggle Button State
            toggleBtn.classList.remove('bg-rose-500', 'hover:bg-rose-400', 'shadow-rose-500/20');
            toggleBtn.classList.add('bg-emerald-500', 'hover:bg-emerald-400', 'shadow-emerald-500/20');
            toggleText.textContent = '시작';
            stopIcon.classList.add('hidden');
            playIcon.classList.remove('hidden');

            // Hide Result Banner
            resultBanner.classList.add('opacity-0', 'scale-95');

            // Generate new target time
            generateTargetTime();
        }

        toggleBtn.addEventListener('click', () => {
            if (isRunning) {
                stopTimer();
            } else {
                startTimer();
            }
        });

        resetBtn.addEventListener('click', resetGame);

        // Spacebar Shortcut
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleBtn.click();
            }
        });

        // Initialize on load
        window.onload = function() {
            generateTargetTime();
        };
    </script>
</body>
</html>
